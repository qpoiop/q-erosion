name: Deploy to Cloudflare Pages

on:
  push:
    branches: [production]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build dist
        run: |
          mkdir -p dist
          cp index.html sw.js manifest.webmanifest dist/
          cp -r src dist/src
          sed -i "s/__BUILD__/${GITHUB_SHA}/" dist/sw.js dist/index.html
          cp -r icons dist/icons
          mkdir -p dist/assets
          cp assets/*.glb assets/*.png dist/assets/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=q-erosion --branch=production

      - name: Deploy relay Worker (Durable Object)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          command: deploy
